name: Fetch public Windows build tools

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: windows-latest
    steps:
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $dir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw "ISCC.exe not found: $dir" }
          Copy-Item -LiteralPath $dir -Destination "$PWD\inno-setup" -Recurse -Force
      - name: Upload Inno Setup compiler
        uses: actions/upload-artifact@v4
        with:
          name: public-inno-setup-compiler
          path: inno-setup
          compression-level: 0
          retention-days: 1
