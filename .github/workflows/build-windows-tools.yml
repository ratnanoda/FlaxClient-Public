name: Fetch public Windows build tools

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download portable Wine and Inno Setup
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL 'https://github.com/Kron4ek/Wine-Builds/releases/download/11.13/wine-11.13-amd64-wow64.tar.xz' -o wine.tar.xz
          curl -fL 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe' -o innosetup-7.0.2-x64.exe
          sha256sum wine.tar.xz innosetup-7.0.2-x64.exe
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: public-wine-inno7-tools
          path: |
            wine.tar.xz
            innosetup-7.0.2-x64.exe
          compression-level: 0
          retention-days: 1
